<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frisch Instagram Dashboard</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#0f1220; color:#eef2ff; }
    header { padding:28px; border-bottom:1px solid #2a3045; }
    h1 { margin:0 0 6px; }
    .sub { color:#aab3d1; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px; padding:28px; }
    .card { background:#1a1f31; border:1px solid #343b55; border-radius:18px; overflow:hidden; }
    .card img, .card video { width:100%; height:280px; object-fit:cover; background:#111; }
    .content { padding:16px; }
    .type { display:inline-block; font-size:12px; color:#b8c0dc; border:1px solid #3b435f; border-radius:999px; padding:5px 9px; margin-bottom:10px; }
    .caption { color:#e8ecff; line-height:1.4; white-space:pre-wrap; max-height:120px; overflow:auto; }
    .date { color:#9aa5c7; font-size:13px; margin-top:12px; }
    a { color:#8db7ff; text-decoration:none; }
    .status { padding:28px; color:#aab3d1; }
  </style>
</head>
<body>
  <header>
    <h1>Frisch Instagram Intelligence Dashboard</h1>
    <div class="sub">Live posts from the Frisch Instagram account</div>
  </header>

  <main id="app">
    <div class="status">Loading live Instagram posts…</div>
  </main>

  <script>
    const app = document.getElementById("app");

    function formatDate(value) {
      try {
        return new Date(value).toLocaleString();
      } catch {
        return value || "";
      }
    }

    function mediaHTML(post) {
      const src = post.thumbnail_url || post.media_url;
      if (!src) return "";

      if (post.media_type === "VIDEO") {
        return `<video controls poster="${post.thumbnail_url || ""}" src="${post.media_url}"></video>`;
      }

      return `<img src="${src}" alt="">`;
    }

    async function loadPosts() {
      try {
        const response = await fetch("/api/posts");
        const json = await response.json();

        if (!response.ok) {
          throw new Error(json.error?.message || json.error || "Instagram API error");
        }

        const posts = json.data || [];

        if (!posts.length) {
          app.innerHTML = `<div class="status">No posts returned.</div>`;
          return;
        }

        app.innerHTML = `
          <section class="grid">
            ${posts.map(post => `
              <article class="card">
                ${mediaHTML(post)}
                <div class="content">
                  <div class="type">${post.media_type || "POST"}</div>
                  <div class="caption">${post.caption || "No caption"}</div>
                  <div class="date">${formatDate(post.timestamp)}</div>
                  <p><a href="${post.permalink}" target="_blank" rel="noopener">Open on Instagram →</a></p>
                </div>
              </article>
            `).join("")}
          </section>
        `;
      } catch (error) {
        app.innerHTML = `<div class="status">Could not load posts: ${error.message}</div>`;
      }
    }

    loadPosts();
  </script>
</body>
</html>
