<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Frisch Instagram Intelligence Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body{
      margin:0;
      background:#0d1020;
      color:white;
      font-family:Arial,sans-serif;
    }

    header{
      padding:28px;
      border-bottom:1px solid #2f3650;
    }

    h1{
      margin:0 0 8px;
      font-size:40px;
    }

    .sub{
      color:#aab4d6;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      padding:28px;
    }

    .stat{
      background:#171b2e;
      border:1px solid #313855;
      border-radius:18px;
      padding:24px;
    }

    .stat h2{
      margin:0;
      font-size:42px;
    }

    .label{
      color:#9ea9cc;
      margin-top:8px;
    }

    .chart-wrap{
      padding:28px;
    }

    .chart-card{
      background:#171b2e;
      border:1px solid #313855;
      border-radius:18px;
      padding:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
      gap:24px;
      padding:28px;
    }

    .card{
      background:#171b2e;
      border:1px solid #313855;
      border-radius:18px;
      overflow:hidden;
    }

    img,video{
      width:100%;
      height:340px;
      object-fit:cover;
      background:black;
    }

    .content{
      padding:18px;
    }

    .pill{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #434d72;
      color:#b5c1e8;
      font-size:12px;
      margin-bottom:12px;
    }

    .caption{
      line-height:1.5;
      color:#e8edff;
      margin-bottom:18px;
      max-height:140px;
      overflow:auto;
      white-space:pre-wrap;
    }

    .metrics{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    .metric{
      background:#202743;
      border-radius:12px;
      padding:12px;
      text-align:center;
    }

    .metric strong{
      display:block;
      font-size:20px;
    }

    .date{
      color:#97a4c8;
      margin-top:16px;
      font-size:13px;
    }

    a{
      color:#8db8ff;
    }
  </style>
</head>

<body>

<header>
  <h1>Frisch Instagram Intelligence Dashboard</h1>
  <div class="sub">
    Live analytics and engagement tracking for the Frisch Instagram account
  </div>
</header>

<section class="stats" id="stats"></section>

<section class="chart-wrap">
  <div class="chart-card">
    <canvas id="engagementChart"></canvas>
  </div>
</section>

<section class="grid" id="posts"></section>

<script>

async function loadDashboard(){

  const response = await fetch("/api/posts");
  const json = await response.json();

  const posts = json.data || [];

  const totalLikes = posts.reduce((a,b)=>a+(b.like_count||0),0);
  const totalComments = posts.reduce((a,b)=>a+(b.comments_count||0),0);
  const totalEngagement = posts.reduce((a,b)=>a+(b.engagement||0),0);

  document.getElementById("stats").innerHTML = `
    <div class="stat">
      <h2>${posts.length}</h2>
      <div class="label">Posts</div>
    </div>

    <div class="stat">
      <h2>${totalLikes}</h2>
      <div class="label">Likes</div>
    </div>

    <div class="stat">
      <h2>${totalComments}</h2>
      <div class="label">Comments</div>
    </div>

    <div class="stat">
      <h2>${totalEngagement}</h2>
      <div class="label">Engagement</div>
    </div>
  `;

  const ctx = document.getElementById("engagementChart");

  new Chart(ctx,{
    type:"bar",
    data:{
      labels:posts.slice(0,10).map((_,i)=>`Post ${i+1}`),
      datasets:[{
        label:"Engagement",
        data:posts.slice(0,10).map(p=>p.engagement||0)
      }]
    }
  });

  document.getElementById("posts").innerHTML = posts.map(post=>`

    <article class="card">

      ${
        post.media_type === "VIDEO"
        ? `<video controls src="${post.media_url}"></video>`
        : `<img src="${post.thumbnail_url || post.media_url}">`
      }

      <div class="content">

        <div class="pill">${post.media_type}</div>

        <div class="caption">
          ${post.caption || "No caption"}
        </div>

        <div class="metrics">

          <div class="metric">
            <strong>${post.like_count || 0}</strong>
            likes
          </div>

          <div class="metric">
            <strong>${post.comments_count || 0}</strong>
            comments
          </div>

          <div class="metric">
            <strong>${post.saves || 0}</strong>
            saves
          </div>

          <div class="metric">
            <strong>${post.shares || 0}</strong>
            shares
          </div>

        </div>

        <div class="date">
          ${new Date(post.timestamp).toLocaleString()}
        </div>

        <p>
          <a href="${post.permalink}" target="_blank">
            Open on Instagram →
          </a>
        </p>

      </div>

    </article>

  `).join("");

}

loadDashboard();

</script>

</body>
</html>
